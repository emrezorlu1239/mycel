name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Lint
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test

  netsim:
    name: NAT scenarios (simulated internet)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install network tools
        run: sudo apt-get update && sudo apt-get install -y ipset conntrack
      - name: Build
        run: cargo build --release
      - name: Run scenarios
        run: sudo scripts/netsim/netsim.sh all
      - name: Collect logs
        if: always()
        # The scenarios run as root and node identity keys are private (0600).
        # Copy only the logs, readable by the runner, and leave the keys out.
        run: |
          mkdir -p netsim-logs
          sudo find /tmp/mycel-netsim \( -name '*.log' -o -name log -o -name summary.txt -o -name invite \) \
            -exec cp --parents {} netsim-logs/ \; 2>/dev/null || true
          sudo chown -R "$(id -u):$(id -g)" netsim-logs
      - name: Keep logs
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: netsim-logs
          path: netsim-logs
          if-no-files-found: warn
